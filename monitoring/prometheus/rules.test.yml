# Run: promtool test rules rules.test.yml
# These tests exercise alert isolation and no-data/stale behavior.
rule_files:
  - "rules.yml"
evaluation_interval: "5s"
group_eval_order:
  - "hycad_status"
  - "hycad_live_alerts"
tests:
  - name: "live partial infection"
    interval: "5s"
    input_series:
      - series: "up{job=\"hycad\",instance=\"detector:9108\",mode=\"live\"}"
        values: "1x24"
      - series: "hycad_ready{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\"}"
        values: "1x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"normal\"}"
        values: "0x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"partial_infection\"}"
        values: "1x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"all_infection\"}"
        values: "0x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"drift\"}"
        values: "0x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"insufficient_data\"}"
        values: "0x24"
    alert_rule_test:
      - eval_time: "120s"
        alertname: "HyCADPartialInfection"
        exp_alerts:
          - exp_labels:
              deployment: "demo"
              mode: "live"
              job: "hycad"
              instance: "detector:9108"
              severity: "warning"
              verdict: "partial_infection"
            exp_annotations:
              summary: "HyCAD 부분 이상 의심"
              description: "demo: 최신 유효 윈도에서 일부 레플리카가 이상으로 지목됐습니다. 레플리카별 A 점수와 입력을 확인하세요."
      - eval_time: "120s"
        alertname: "HyCADAllInfection"
        exp_alerts: []
      - eval_time: "120s"
        alertname: "HyCADDrift"
        exp_alerts: []
      - eval_time: "120s"
        alertname: "HyCADLiveDataUnavailable"
        exp_alerts: []
    promql_expr_test:
      - expr: "hycad:verdict_code:current"
        eval_time: "120s"
        exp_samples:
          - labels: "hycad:verdict_code:current{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\"}"
            value: 1
  - name: "live all infection"
    interval: "5s"
    input_series:
      - series: "up{job=\"hycad\",instance=\"detector:9108\",mode=\"live\"}"
        values: "1x24"
      - series: "hycad_ready{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\"}"
        values: "1x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"normal\"}"
        values: "0x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"partial_infection\"}"
        values: "0x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"all_infection\"}"
        values: "1x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"drift\"}"
        values: "0x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"insufficient_data\"}"
        values: "0x24"
    alert_rule_test:
      - eval_time: "120s"
        alertname: "HyCADPartialInfection"
        exp_alerts: []
      - eval_time: "120s"
        alertname: "HyCADAllInfection"
        exp_alerts:
          - exp_labels:
              deployment: "demo"
              mode: "live"
              job: "hycad"
              instance: "detector:9108"
              severity: "critical"
              verdict: "all_infection"
            exp_annotations:
              summary: "HyCAD 전체 이상 의심"
              description: "demo: A 침묵, B 이상 및 C 변동 조건이 충족됐습니다. 모델 판정이며 실제 침해 여부는 원본 근거로 확인하세요."
      - eval_time: "120s"
        alertname: "HyCADDrift"
        exp_alerts: []
      - eval_time: "120s"
        alertname: "HyCADLiveDataUnavailable"
        exp_alerts: []
    promql_expr_test:
      - expr: "hycad:verdict_code:current"
        eval_time: "120s"
        exp_samples:
