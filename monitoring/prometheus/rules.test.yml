    input_series:
      - series: 'up{job="hycad",instance="capture-replay:9110",mode="replay"}'
        values: "1x24"
      - series: 'hycad_ready{deployment="catalogue",mode="replay",capture="normal",job="hycad",instance="capture-replay:9110"}'
        values: "1x24"
      - series: 'hycad_verdict{deployment="catalogue",mode="replay",capture="normal",job="hycad",instance="capture-replay:9110",verdict="normal"}'
        values: "1x24"
      - series: 'hycad_ready{deployment="catalogue",mode="replay",capture="partial",job="hycad",instance="capture-replay:9110"}'
        values: "1x24"
      - series: 'hycad_verdict{deployment="catalogue",mode="replay",capture="partial",job="hycad",instance="capture-replay:9110",verdict="partial_infection"}'
        values: "1x24"
      - series: 'hycad_ready{deployment="catalogue",mode="replay",capture="unavailable",job="hycad",instance="capture-replay:9110"}'
