        values: "1x24"
      - series: "hycad_verdict{deployment=\"demo\",mode=\"live\",job=\"hycad\",instance=\"detector:9108\",verdict=\"insufficient_data\"}"
        values: "0x24"
    alert_rule_test:
      - eval_time: "120s"
        alertname: "HyCADPartialInfection"
        exp_alerts: []
      - eval_time: "120s"
        alertname: "HyCADAllInfection"
        exp_alerts: []
      - eval_time: "120s"
