global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: hycad
    honor_labels: true
    static_configs:
      - targets: [detector:9108]
        labels:
          mode: replay

# No Alertmanager destination is configured. Alerts are visible in Prometheus
# and Grafana, but do not send email, chat messages, or webhooks.
