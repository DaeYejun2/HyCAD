# Temporary first-certificate mode: no Grafana login over cleartext HTTP.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "HTTPS setup in progress\n";
    }
}
