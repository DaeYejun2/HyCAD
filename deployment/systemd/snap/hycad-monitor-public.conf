# Optional drop-in for hycad-monitor.service on the Snap Docker monitor host.
# Install as /etc/systemd/system/hycad-monitor.service.d/public.conf only after
# creating the Viewer account and setting the actual HTTPS HYCAD_PUBLIC_URL in
# /etc/hycad/monitor.env. See docs/public-access.md for manual enrollment and
# pre-publication authentication checks. This does not enable Funnel itself.
# Keep all four files on start AND stop; the base pair restores anonymous access.
[Service]
ExecStart=
ExecStart=/usr/bin/docker --host ${DOCKER_HOST} compose --project-directory /var/snap/docker/common/hycad/current --env-file /etc/hycad/monitor.env -f /var/snap/docker/common/hycad/current/compose.yaml -f /var/snap/docker/common/hycad/current/compose.server.yaml -f /var/snap/docker/common/hycad/current/compose.public.yaml -f /var/snap/docker/common/hycad/current/compose.funnel.yaml up --detach --no-build --remove-orphans
ExecStop=
ExecStop=/usr/bin/docker --host ${DOCKER_HOST} compose --project-directory /var/snap/docker/common/hycad/current --env-file /etc/hycad/monitor.env -f /var/snap/docker/common/hycad/current/compose.yaml -f /var/snap/docker/common/hycad/current/compose.server.yaml -f /var/snap/docker/common/hycad/current/compose.public.yaml -f /var/snap/docker/common/hycad/current/compose.funnel.yaml stop --timeout 30
