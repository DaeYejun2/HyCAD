# Direct HTTPS gateway mode; no Tailscale container is needed in this mode.
# Replace /etc/systemd/system/hycad-monitor.service.d/public.conf with this file
# after HTTPS/authentication checks and the actual HYCAD_PUBLIC_URL are ready.
# Removing an unused Funnel container must retain its identity/state volume.
# Keep all three files on start AND stop; the base pair restores anonymous access.
[Service]
ExecStart=
ExecStart=/usr/bin/docker --host ${DOCKER_HOST} compose --project-directory /var/snap/docker/common/hycad/current --env-file /etc/hycad/monitor.env -f /var/snap/docker/common/hycad/current/compose.yaml -f /var/snap/docker/common/hycad/current/compose.server.yaml -f /var/snap/docker/common/hycad/current/compose.public.yaml up --detach --no-build --remove-orphans
ExecStop=
ExecStop=/usr/bin/docker --host ${DOCKER_HOST} compose --project-directory /var/snap/docker/common/hycad/current --env-file /etc/hycad/monitor.env -f /var/snap/docker/common/hycad/current/compose.yaml -f /var/snap/docker/common/hycad/current/compose.server.yaml -f /var/snap/docker/common/hycad/current/compose.public.yaml stop --timeout 30
