# marine-normal 배포용. 로컬(live/prometheus.yml)과 달리 job 이 셋이다.
#
#   hycad          백필된 실험 기록. 스크레이프 대상은 없고 TSDB 블록만 있다
#   hycad-demo     배속 데모 (한 바퀴 2분 39초)
#   hycad-realtime sysdig 로 지금 도는 컨테이너를 보는 진짜 실시간
#
# Prometheus 자체는 127.0.0.1 에만 묶는다. Grafana 데이터소스가 access: proxy 라
# Grafana 서버가 대신 조회하므로 9090 을 밖으로 열 필요가 없다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 배속 데모. 1초/스냅샷이라 스크레이프도 1초.
  - job_name: hycad-demo
    scrape_interval: 1s
    static_configs:
      - targets: ['127.0.0.1:9901']
        labels: {env: demo}

  # 진짜 실시간. 30초 스냅샷이라 15초면 충분하다.
  - job_name: hycad-realtime
    scrape_interval: 15s
    static_configs:
      - targets: ['127.0.0.1:9900']
        labels: {env: live}

  # job "hycad" 는 백필 블록에만 들어 있다. 긁을 대상이 없으므로 여기 적지 않는다.
  # (대시보드 hycad-live 는 그 블록을 그대로 읽는다)
