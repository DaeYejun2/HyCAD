# HyCAD 익스포터용 최소 설정.
#   prometheus.exe --config.file=prometheus.yml
#
# 스냅샷이 30초마다 한 번 갱신되므로 15초 스크레이프면 같은 값이 두 번 찍힌다.
# gauge 라 계단 모양이 되고, 스냅샷 경계가 어긋나도 한 칸 밀리지 않는다.
# 30초로 맞추면 경계와 어긋났을 때 스냅샷을 통째로 놓칠 수 있다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 대시보드 hycad-live. 백필된 실험 전체 + 같은 포트의 리플레이.
  - job_name: hycad
    # 리플레이는 스냅샷을 5초마다 흘리므로 스크레이프도 5초로 맞춘다.
    # 진짜 라이브(30초 스냅샷)로 바꾸면 15s 로 되돌릴 것.
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9900']
        labels: {env: replay}
      # 서버 라이브 (marine-normal). 쓰지 않으면 지운다.
      # - targets: ['marine-normal:9900']
      #   labels: {env: live}

  # 대시보드 hycad-demo. 배속 시나리오. 1초/스냅샷이라 스크레이프도 1초.
  - job_name: hycad-demo
    scrape_interval: 1s
    static_configs:
      - targets: ['localhost:9901']
        labels: {env: demo}
